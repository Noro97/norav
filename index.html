<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo-new.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="color-scheme" content="dark" />
    <!-- Replaced per page by PageHead; this is what a reader sees for the one
         frame before React runs, and what a crawler without JS is left with. -->
    <title>Norayr Avetisyan — Frontend-Focused Fullstack Engineer</title>
    <meta name="author" content="Norayr Avetisyan" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <!-- og:image, og:title and og:description are written per page by PageHead.
         A copy here would win by being first and pin every page to one card. -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <!-- Twitter Card -->
    <!-- Only the card's shape. Its title and description are written per page
         by PageHead — a value here would win by being first and pin every page
         to one headline. -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Norayr Avetisyan",
      "jobTitle": "Senior Frontend Engineer / UI Architect",
      "url": "https://norav.dev",
      "email": "noroavetisyan@gmail.com",
      "sameAs": [
        "https://github.com/Noro97",
        "https://www.linkedin.com/in/norayravetisyan/",
        "https://t.me/antarber"
      ],
      "knowsAbout": ["React", "Next.js", "TypeScript", "Vue.js", "Design Systems", "Micro-frontends", "Storybook", "Telegram Mini Apps"],
      "knowsLanguage": ["Armenian", "Russian", "English"],
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Armenian State University of Economics"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Yerevan",
        "addressCountry": "AM"
      }
    }
    </script>

    <!-- Fonts: preconnect + display=swap for fast loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link href="/static/style.css" rel="stylesheet" />
  </head>
  <body class="bg-background min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
