name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size
        run: npm run size:check

      # @lhci/cli 0.16 needs Node 22. It brings Lighthouse 13, the version behind the
      # baseline in .tasks/STATE.md: 12 reads about twice as slow on the same build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Warn-only until S4 makes these the D11 failure.
      - name: Lighthouse (warn-only)
        continue-on-error: true
        run: npx -y @lhci/cli@0.16.0 autorun

      # A passing run prints no numbers, so this report is the only record of them.
      # `.lighthouseci` is a hidden folder, which upload-artifact skips by default.
      - name: Keep the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: warn

  cms:
    name: CMS and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Schema tests (PGlite)
        working-directory: db
        run: |
          npm install
          npm test

      - name: CMS type check, tests and build
        working-directory: cms
        run: |
          npm install
          npm run typecheck
          npm test
          npx next build

  # D20: a PR labelled merge-when-green merges itself once every check on its latest
  # commit has passed. GitHub's own auto-merge needs branch protection, which a private
  # repo on this plan can't have. The comment wakes the session through Auto-fix.
  merge-when-green:
    name: Merge when green
    needs: [ci, cms]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Merge if labelled and green
        run: |
          read_state() {
            gh pr view "$PR" --json labels,headRefOid,state,statusCheckRollup --jq '
              [.labels[].name] as $labels
              | [.statusCheckRollup[]
                  | select((.name // .context) != "Merge when green")
                  | (if (.conclusion // "") != "" then .conclusion else (.state // .status // "") end)] as $checks
              | {
                  labelled: ($labels | index("merge-when-green") != null),
                  current: (.headRefOid == env.HEAD_SHA and .state == "OPEN"),
                  failed: ($checks | map(select(IN("SUCCESS", "SKIPPED", "NEUTRAL") | not) | select(IN("PENDING", "IN_PROGRESS", "QUEUED", "WAITING", "EXPECTED", "") | not)) | length),
                  waiting: ($checks | map(select(IN("PENDING", "IN_PROGRESS", "QUEUED", "WAITING", "EXPECTED", ""))) | length)
                } | "\(.labelled) \(.current) \(.failed) \(.waiting)"'
          }

          # Vercel reports separately, and can still be building when CI ends.
          for attempt in $(seq 1 40); do
            # On its own line, so a failed read stops the job instead of looking like no label.
            state="$(read_state)"
            read -r labelled current failed waiting <<< "$state"
            if [ "$labelled" != "true" ]; then echo "No merge-when-green label, so this PR waits."; exit 0; fi
            if [ "$current" != "true" ]; then echo "A newer commit or a closed PR: nothing to merge here."; exit 0; fi
            if [ "$failed" != "0" ]; then echo "$failed check(s) failed."; exit 1; fi
            if [ "$waiting" = "0" ]; then break; fi
            echo "Waiting for $waiting check(s), attempt $attempt."
            sleep 30
          done
          if [ "$waiting" != "0" ]; then echo "Checks still running after 20 minutes."; exit 1; fi

          gh pr comment "$PR" --body "Every check passed on ${HEAD_SHA:0:7}. Merging."
          gh pr merge "$PR" --merge --match-head-commit "$HEAD_SHA"
