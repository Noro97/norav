name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size
        run: npm run size:check

      # @lhci/cli 0.16 needs Node 22. It brings Lighthouse 13, the version behind the
      # baseline in .tasks/STATE.md: 12 reads about twice as slow on the same build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Warn-only until S4 makes these the D11 failure.
      - name: Lighthouse (warn-only)
        continue-on-error: true
        run: npx -y @lhci/cli@0.16.0 autorun

      # A passing run prints no numbers, so this report is the only record of them.
      # `.lighthouseci` is a hidden folder, which upload-artifact skips by default.
      - name: Keep the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: warn

  cms:
    name: CMS and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Schema tests (PGlite)
        working-directory: db
        run: |
          npm install
          npm test

      - name: CMS type check, tests and build
        working-directory: cms
        run: |
          npm install
          npm run typecheck
          npm test
          npx next build
